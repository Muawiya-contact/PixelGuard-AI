name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to the same branch cancels the previous run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-ci:
    name: Backend (Python 3.11)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          # TestClient needs httpx; it is only a transitive dep of google-genai,
          # so pin it here rather than depend on that staying true.
          pip install httpx

      - name: Compile all backend sources
        run: python -m compileall -q backend

      # Runs from backend/ so `import main` resolves. No API key is set here:
      # the Gemini client is created lazily, so import must not require one.
      - name: Import sanity check
        working-directory: backend
        run: python -c "import main; print('Backend syntax check passed')"

      - name: Verify the FastAPI app serves requests
        working-directory: backend
        run: |
          python - <<'PY'
          from fastapi.testclient import TestClient
          import main

          client = TestClient(main.app)

          r = client.get("/")
          assert r.status_code == 200, r.status_code
          assert r.json()["message"] == "PixelGuard Backend API Active", r.json()
          print("GET / ->", r.json())

          r = client.get("/api/v1/health")
          assert r.status_code == 200, r.status_code
          print("GET /api/v1/health ->", r.json())

          # Without an API key configured, analyze must fail closed with 503
          # rather than 500.
          r = client.post(
              "/api/v1/forensics/analyze",
              files={"file": ("t.png", b"not-an-image", "image/png")},
          )
          assert r.status_code in (400, 503), f"unexpected {r.status_code}: {r.text}"
          print("POST /api/v1/forensics/analyze (no key) ->", r.status_code)

          print("Backend endpoint checks passed")
          PY

      - name: Verify CORS allows Vercel origins
        working-directory: backend
        run: |
          python - <<'PY'
          from fastapi.testclient import TestClient
          import main

          client = TestClient(main.app)
          preflight = {
              "Access-Control-Request-Method": "POST",
              "Access-Control-Request-Headers": "content-type",
          }

          allowed = [
              "https://pixelguard-ai.vercel.app",
              "https://pixelguard-ai-git-main-user.vercel.app",
              "http://localhost:5173",
          ]
          blocked = ["https://evil.example.com", "https://notvercel.app"]

          for origin in allowed:
              r = client.options(
                  "/api/v1/forensics/analyze", headers={"Origin": origin, **preflight}
              )
              assert r.headers.get("access-control-allow-origin"), f"{origin} was blocked"
              print("allowed:", origin)

          for origin in blocked:
              r = client.options(
                  "/api/v1/forensics/analyze", headers={"Origin": origin, **preflight}
              )
              assert not r.headers.get(
                  "access-control-allow-origin"
              ), f"{origin} should not be allowed"
              print("blocked:", origin)

          print("CORS checks passed")
          PY

  frontend-ci:
    name: Frontend (Node 20)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build production bundle
        working-directory: frontend
        run: npm run build

      - name: Verify build output
        working-directory: frontend
        run: |
          test -f dist/index.html || { echo "dist/index.html missing"; exit 1; }
          echo "Frontend build verified:"
          ls -lh dist

  docker-build:
    name: Backend Docker image
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Catches Dockerfile breakage before Render does.
      - name: Build image
        run: docker build -t pixelguard-backend:ci ./backend

      - name: Verify the container boots and serves
        run: |
          docker run -d --name pixelguard-ci -p 8000:8000 pixelguard-backend:ci
          for i in $(seq 1 30); do
            if curl -sf -o /dev/null http://localhost:8000/; then
              echo "Container is serving"
              curl -s http://localhost:8000/api/v1/health
              echo
              docker rm -f pixelguard-ci >/dev/null
              exit 0
            fi
            sleep 2
          done
          echo "Container failed to serve in time. Logs:"
          docker logs pixelguard-ci
          docker rm -f pixelguard-ci >/dev/null
          exit 1
