# Render Blueprint for the PixelGuard backend.
# NOTE: Render's Blueprint flow only auto-detects render.yaml at the REPO ROOT.
# Either copy this file to the repo root (it already targets backend/ via rootDir),
# or skip Blueprints and create the service manually in the dashboard — see README.
services:
  - type: web
    name: pixelguard-backend
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      # No Gemini key is declared on purpose. The analyze endpoints are
      # unauthenticated, so a key on a public backend is a bill anyone can run
      # up; the service is meant to run keyless and answer 503 for the
      # model-backed routes. To run YOUR OWN keyed instance, add
      # PAID_GEMINI_API_KEY (or GOOGLE_API_KEY) in the Render dashboard with
      # sync: false — never a value in git. See docs/BRING-YOUR-OWN-KEY.md.
      # - key: PAID_GEMINI_API_KEY
      #   sync: false
      # Vercel origins (production + previews) are allowed by default via
      # CORS_ORIGIN_REGEX, so CORS_ORIGINS is only needed for other hosts.
      # Set it to "*" to allow every origin during demos/hackathon evaluation.
      - key: CORS_ORIGINS
        sync: false
